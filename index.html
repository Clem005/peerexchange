<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Campus Cuts — Slot Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--s1:#101010;--s2:#161616;--s3:#1c1c1c;
  --bd:#222;--bd2:#2a2a2a;
  --t1:#f0f0f0;--t2:#888;--t3:#444;--t4:#2a2a2a;
  --blue:#3b82f6;--bludk:#1d4ed8;--blubg:#0f1c38;
  --green:#22c55e;--grnbg:#0b1c0b;
  --amber:#f59e0b;--ambg:#1d1300;
  --red:#f87171;--rdbg:#1a0808;
  --acc:#a78bfa;--acbg:#1a1028;
  --pink:#f472b6;--pkbg:#1a0a14;
}
html,body{background:var(--bg);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body{display:flex;justify-content:center;align-items:flex-start;padding:20px 12px 40px}

/* ── Phone shell ── */
.phone{background:var(--s1);border:1.5px solid #1a1a1a;border-radius:44px;
  width:100%;max-width:393px;display:flex;flex-direction:column;overflow:hidden;
  position:relative;min-height:700px;box-shadow:0 40px 120px rgba(0,0,0,.75),0 0 0 1px #111}
.notch{height:12px;background:var(--s1);display:flex;align-items:center;justify-content:center;padding-top:4px;flex-shrink:0}
.notch-pill{width:80px;height:6px;background:#1a1a1a;border-radius:4px}
.screen{flex:1;overflow-y:auto;scroll-behavior:smooth;position:relative;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}

/* ── Topbar ── */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 20px 0;margin-bottom:18px}
.topbar-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px}
.topbar-sub{font-size:11px;color:var(--t3);margin-top:3px;font-weight:500}
.icon-btn{width:34px;height:34px;background:transparent;border:1px solid var(--bd);border-radius:10px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--t3);position:relative}
.icon-btn:hover{background:var(--s3);border-color:var(--bd2);color:var(--t2)}
.notif-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;
  background:var(--red);border:2px solid var(--s1);animation:pulse 2s infinite}

/* ── Live pill ── */
.live-pill{display:inline-flex;align-items:center;gap:5px;background:var(--grnbg);border:1px solid #22c55e22;
  color:var(--green);font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Avatar ── */
.av{border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#0d1c30);border:1px solid #1a3355;
  color:#60a5fa;font-weight:700;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-family:'Syne',sans-serif}

/* ── My card ── */
.my-card{margin:0 16px;background:linear-gradient(135deg,var(--s2) 0%,#0f0f0f 100%);
  border:1px solid var(--bd);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.my-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;
  background:radial-gradient(circle,#3b82f608 0%,transparent 70%);pointer-events:none}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.ctag{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--t4);margin-bottom:6px}
.csvc{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--t1);letter-spacing:-.4px}
.cmeta{font-size:13px;color:var(--t3);margin-top:4px;font-weight:500}
.cprice{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--green);
  background:var(--grnbg);border:1px solid #22c55e22;padding:5px 12px;border-radius:12px}
.sbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:20px;margin-bottom:14px}
.sb-confirmed{background:var(--grnbg);color:var(--green);border:1px solid #22c55e22}
.sb-listed{background:var(--ambg);color:var(--amber);border:1px solid #f59e0b22}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.divider{border:none;border-top:1px solid var(--bd);margin:14px 0}

/* ── Buttons ── */
.btn{padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;border:none;
  letter-spacing:-.1px;font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s;display:inline-block}
.btn-full{display:block;width:100%}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--bludk)}
.btn-ghost{background:transparent;border:1px solid var(--bd2);color:var(--t3)}.btn-ghost:hover{background:var(--s3);color:var(--t2)}
.btn-danger{background:transparent;border:1px solid #331212;color:var(--red)}.btn-danger:hover{background:var(--rdbg)}
.btn-lock{background:var(--s1);border:1px solid var(--bd);color:var(--t4);cursor:not-allowed}.btn-lock:active{transform:none}
.btn-green{background:#16532d;color:var(--green);border:1px solid #22c55e33}.btn-green:hover{background:#1a6234}
.btn-amber{background:var(--ambg);color:var(--amber);border:1px solid #f59e0b33}.btn-amber:hover{background:#261a00}
.btn-acc{background:var(--acbg);border:1px solid #a78bfa33;color:var(--acc)}.btn-acc:hover{background:#241538}
.btn-pink{background:var(--pkbg);border:1px solid #f472b633;color:var(--pink)}.btn-pink:hover{background:#250d1b}
.btn-row{display:flex;gap:8px;align-items:center}
.icon-only{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Nudge ── */
.nudge{display:flex;align-items:flex-start;gap:9px;background:var(--ambg);border:1px solid #f59e0b22;
  border-radius:12px;padding:11px 13px;margin-top:12px;animation:slideDown .2s ease}
.nudge-txt{font-size:12px;color:var(--amber);line-height:1.55;font-weight:500}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ── Section header ── */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 10px}
.sec-lbl{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--t2);letter-spacing:-.2px}
.cnt-badge{background:var(--s2);color:var(--t3);font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:20px;border:1px solid var(--bd)}

/* ── Filter chips ── */
.filter-row{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:nowrap;overflow-x:auto}
.filter-row::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;background:var(--s2);border:1px solid var(--bd);color:var(--t3);font-size:12px;
  font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .15s;white-space:nowrap}
.fchip:hover{border-color:var(--bd2);color:var(--t2)}
.fchip.active{background:var(--blubg);border-color:#3b82f633;color:#60a5fa}

/* ── Swap cards ── */
.scard{margin:0 16px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:18px;
  padding:15px 16px;transition:all .2s;position:relative;overflow:hidden}
.scard:hover{border-color:#2a2a2a;background:#181818;transform:translateY(-1px)}
.scard-hot{border-color:#f59e0b33;background:linear-gradient(135deg,#1d1300 0%,var(--s2) 100%)}
.scard-new{border-color:#3b82f633}
.scard-tag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;padding:3px 8px;border-radius:20px}
.tag-hot{background:#f59e0b18;color:var(--amber);border:1px solid #f59e0b22}
.tag-new{background:#3b82f618;color:#60a5fa;border:1px solid #3b82f622}
.tag-wl{background:#a78bfa18;color:var(--acc);border:1px solid #a78bfa22}
.scard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.urow{display:flex;align-items:center;gap:8px}
.uname{font-size:12px;color:var(--t3);font-weight:500}
.urating{font-size:11px;color:var(--amber);font-weight:600;margin-left:2px}
.ssvc{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#e0e0e0;margin-bottom:3px}
.sdt{font-size:12px;color:var(--t3)}
.dchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:20px;margin-top:9px}
.dc-up{background:#1a0b0b;color:var(--red);border:1px solid #f8717122}
.dc-dn{background:#0b1a0b;color:#4ade80;border:1px solid #4ade8022}
.dc-eq{background:var(--s1);color:var(--t3);border:1px solid var(--bd)}
.scard-footer{display:flex;align-items:center;justify-content:space-between;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.listed-ago{font-size:11px;color:var(--t4)}

/* ── Waitlist chip on cards ── */
.wl-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  color:var(--acc);background:var(--acbg);border:1px solid #a78bfa22;
  padding:3px 9px;border-radius:20px;margin-top:8px}

/* ── Empty state ── */
.empty{text-align:center;padding:32px 20px;margin:0 16px}
.empty-ic{width:48px;height:48px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty-t{font-family:'Syne',sans-serif;font-size:14px;color:var(--t3);font-weight:700}
.empty-s{font-size:12px;color:var(--t4);margin-top:4px}

/* ── Modal ── */
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.88);border-radius:44px;
  display:flex;flex-direction:column;justify-content:flex-end;z-index:20;backdrop-filter:blur(4px)}
.modal{background:#141414;border-top:1px solid var(--bd);border-radius:26px 26px 0 0;
  padding:20px 20px 30px;animation:slideUp .28s cubic-bezier(.25,.8,.25,1);max-height:90%;overflow-y:auto}
.modal::-webkit-scrollbar{display:none}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:3px;border-radius:3px;background:#2a2a2a;margin:0 auto 20px}
.modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--t1);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--t3);margin-bottom:16px;line-height:1.6}
.mprev{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:16px;padding:4px 14px}
.mrow{display:flex;align-items:flex-start;padding:10px 0;gap:14px}
.mrow+.mrow{border-top:1px solid #161616}
.mlbl{font-size:11px;font-weight:700;color:var(--t3);width:56px;flex-shrink:0;padding-top:2px;letter-spacing:.3px}
.mval{font-size:13px;font-weight:600;line-height:1.5}
.m-old{color:var(--amber)}.m-new{color:var(--green)}.m-with{color:#60a5fa}
.modal-btns{display:flex;gap:9px;margin-top:16px}
.modal-cancel{flex:1;background:transparent;border:1px solid var(--bd2);color:var(--t3);
  font-size:14px;font-weight:500;padding:13px;border-radius:14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s}
.modal-cancel:hover{background:var(--s3)}
.modal-confirm{flex:2;background:var(--blue);border:none;color:#fff;font-size:14px;font-weight:700;
  padding:13px;border-radius:14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s}
.modal-confirm:hover{background:var(--bludk)}

/* ── Toast ── */
.toast{position:absolute;top:16px;left:12px;right:12px;z-index:30;background:#071510;
  border:1px solid #22c55e33;border-radius:18px;padding:12px 14px;
  display:flex;align-items:center;gap:11px;
  animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast-err{background:#120707;border-color:#f8717133}
.toast-info{background:#0d1622;border-color:#3b82f633}
.toast-title{font-size:13px;font-weight:700;color:var(--green);font-family:'Syne',sans-serif}
.toast-err .toast-title{color:var(--red)}.toast-info .toast-title{color:#60a5fa}
.toast-sub{font-size:11px;color:#1a5e30;margin-top:2px}
.toast-err .toast-sub{color:#5e1a1a}.toast-info .toast-sub{color:#1a3055}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ── Bottom nav ── */
.bottom-nav{display:flex;border-top:1px solid #161616;background:#0a0a0a;padding:2px 0 10px;flex-shrink:0}
.nav-btn{flex:1;padding:10px 0 6px;background:transparent;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;
  transition:opacity .15s;position:relative}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.3px}
.nav-notif{position:absolute;top:8px;right:calc(50% - 14px);width:7px;height:7px;border-radius:50%;
  background:var(--red);border:1.5px solid #0a0a0a}

/* ── Auth ── */
.auth-wrap{padding:32px 20px 28px;display:flex;flex-direction:column;min-height:590px}
.auth-logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--blubg),#0a0a0a);
  border:1px solid #3b82f622;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.auth-brand{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--t1);letter-spacing:-.6px;text-align:center}
.auth-tagline{font-size:12px;color:var(--t3);margin-top:4px;text-align:center;font-weight:500}
.auth-group{margin-bottom:18px}
.auth-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;display:block}
.auth-input-wrap{display:flex;align-items:center;background:var(--s2);border:1.5px solid var(--bd);
  border-radius:14px;overflow:hidden;transition:border-color .15s}
.auth-input-wrap:focus-within{border-color:#3b82f644}
.auth-prefix{font-size:14px;color:var(--t3);font-weight:600;padding:0 10px 0 14px}
.auth-input{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:15px;
  font-weight:500;padding:14px 14px 14px 4px;font-family:'DM Sans',sans-serif}
.auth-input::placeholder{color:var(--t4)}
.auth-err{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--red);margin-top:8px;font-weight:500}
.auth-hint{font-size:11px;color:var(--t4);margin-top:8px;line-height:1.6}
.otp-grid{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
.otp-box{width:64px;height:68px;text-align:center;background:var(--s2);border:1.5px solid var(--bd);
  border-radius:16px;color:var(--t1);font-size:26px;font-weight:700;outline:none;
  font-family:'Syne',sans-serif;transition:border-color .15s}
.otp-box:focus{border-color:var(--blue)}.otp-box.filled{border-color:#3b82f633;background:var(--blubg)}
.demo-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.demo-pill{background:var(--s2);border:1px solid var(--bd);color:var(--t3);font-size:11px;font-weight:600;
  padding:6px 12px;border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.demo-pill:hover{background:var(--s3);color:var(--t2);border-color:var(--bd2)}
.progress-steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:28px}
.pstep{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.pstep-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;font-family:'Syne',sans-serif}
.pstep-done .pstep-num{background:var(--grnbg);color:var(--green);border:1px solid #22c55e33}
.pstep-active .pstep-num{background:var(--blue);color:#fff}
.pstep-idle .pstep-num{background:var(--s2);color:var(--t4);border:1px solid var(--bd)}
.pstep-label{font-size:10px;font-weight:600}
.pstep-done .pstep-label{color:var(--green)}.pstep-active .pstep-label{color:#fff}.pstep-idle .pstep-label{color:var(--t4)}
.pstep-line{flex:1;height:1px;background:var(--bd);max-width:36px}

/* ── Profile sheet ── */
.profile-row{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid #141414}
.profile-lbl{font-size:14px;font-weight:500;color:var(--t2)}
.profile-val{font-size:13px;font-weight:600;color:var(--t3)}

/* ── Pill ── */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px}
.pill-green{background:var(--grnbg);border:1px solid #22c55e22;color:var(--green)}
.pill-amber{background:var(--ambg);border:1px solid #f59e0b22;color:var(--amber)}
.pill-blue{background:var(--blubg);border:1px solid #3b82f622;color:#60a5fa}
.pill-gray{background:var(--s2);border:1px solid var(--bd);color:var(--t3)}
.pill-acc{background:var(--acbg);border:1px solid #a78bfa22;color:var(--acc)}
.pill-pink{background:var(--pkbg);border:1px solid #f472b622;color:var(--pink)}

/* ── Stats strip ── */
.stats-strip{display:flex;gap:0;margin:0 16px;background:var(--s2);border:1px solid var(--bd);
  border-radius:16px;overflow:hidden;margin-bottom:16px}
.stat-item{flex:1;padding:12px 10px;text-align:center;border-right:1px solid var(--bd)}
.stat-item:last-child{border-right:none}
.stat-val{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--t1)}
.stat-lbl{font-size:10px;color:var(--t4);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}

/* ── Booking ── */
.book-section{padding:0 16px;margin-bottom:4px}
.book-step-label{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:12px;margin-top:20px}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Syne',sans-serif}
.step-num.done{background:var(--grnbg);border:1px solid #22c55e33}
.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc-card{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:12px 13px;
  cursor:pointer;text-align:left;transition:all .15s;font-family:'DM Sans',sans-serif}
.svc-card:hover{border-color:var(--bd2);background:var(--s3)}
.svc-sel{border-color:var(--blue)!important;background:var(--blubg)!important}
.svc-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#e0e0e0;margin-bottom:2px}
.svc-meta{font-size:11px;color:var(--t3)}
.svc-sel .svc-name{color:#60a5fa}.svc-sel .svc-meta{color:#1d3a6e}
.day-row{display:flex;gap:6px;flex-wrap:wrap}
.day-btn{background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:7px 14px;
  font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.day-btn:hover{border-color:var(--bd2);color:var(--t2)}
.day-sel{background:var(--blubg);border-color:var(--blue);color:#60a5fa}
.day-today{border-color:#22c55e33;color:var(--green)}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.time-btn{background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:10px 4px;
  font-size:12px;font-weight:500;color:var(--t3);cursor:pointer;font-family:'DM Sans',sans-serif;
  text-align:center;transition:all .15s;line-height:1.3}
.time-btn:hover{border-color:var(--bd2);color:var(--t2)}
.time-sel{background:var(--blubg);border-color:var(--blue);color:#60a5fa;font-weight:700}
.time-taken{background:var(--s1);color:var(--t4);cursor:not-allowed;text-decoration:line-through;opacity:.4}
.time-popular{border-color:#f59e0b22;color:var(--amber)}
.summary-card{margin:12px 16px 8px;background:linear-gradient(135deg,var(--blubg) 0%,var(--s1) 100%);
  border:1px solid #3b82f622;border-radius:18px;padding:16px}
.summary-svc{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--t1)}
.summary-when{font-size:13px;color:var(--t3);font-weight:500}
.summary-pills{display:flex;gap:7px;margin-top:10px}

/* ── History ── */
.hist-item{display:flex;align-items:flex-start;gap:13px;padding:14px 20px;
  border-bottom:1px solid #141414;transition:background .15s;cursor:pointer}
.hist-item:hover{background:#0e0e0e}
.hist-item:last-child{border-bottom:none}
.hist-ic{width:36px;height:36px;border-radius:50%;background:var(--grnbg);border:1px solid #22c55e1a;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hist-svc{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#ddd}
.hist-meta{font-size:12px;color:var(--t4);margin-top:2px;line-height:1.5}
.hist-with{font-size:11px;color:#2a4a2a;margin-top:3px}
.hist-right{margin-left:auto;text-align:right;flex-shrink:0}
.hist-date{font-size:11px;color:var(--t4);margin-top:4px}

/* ── Review stars ── */
.star-row{display:flex;gap:6px;justify-content:center;margin:14px 0}
.star-btn{font-size:28px;cursor:pointer;transition:transform .15s;filter:grayscale(1) brightness(.4);line-height:1}
.star-btn.lit{filter:grayscale(0) brightness(1);transform:scale(1.15)}
.star-btn:hover{transform:scale(1.25)}
.review-input{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:14px;
  color:var(--t1);font-size:13px;font-weight:400;padding:12px 14px;font-family:'DM Sans',sans-serif;
  outline:none;resize:none;line-height:1.5;transition:border-color .15s}
.review-input:focus{border-color:#3b82f644}
.review-input::placeholder{color:var(--t4)}
.review-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  color:var(--amber);background:var(--ambg);border:1px solid #f59e0b22;padding:3px 8px;border-radius:20px}

/* ── Chat screen ── */
.chat-msgs{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.mine{flex-direction:row-reverse}
.bubble{max-width:72%;padding:10px 13px;border-radius:18px;font-size:13px;line-height:1.5;font-weight:400}
.bubble-them{background:var(--s3);border:1px solid var(--bd2);color:var(--t1);border-bottom-left-radius:5px}
.bubble-mine{background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg-time{font-size:10px;color:var(--t4);margin-bottom:2px;flex-shrink:0;align-self:flex-end}
.chat-input-row{display:flex;gap:8px;padding:10px 16px 8px;border-top:1px solid var(--bd);background:var(--s1)}
.chat-input{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:20px;
  color:var(--t1);font-size:14px;padding:10px 14px;font-family:'DM Sans',sans-serif;outline:none;
  transition:border-color .15s}
.chat-input:focus{border-color:#3b82f644}
.chat-input::placeholder{color:var(--t4)}
.chat-send{width:38px;height:38px;border-radius:50%;background:var(--blue);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.chat-send:hover{background:var(--bludk)}
.chat-system{text-align:center;font-size:11px;color:var(--t4);padding:4px 0}

/* ── Waitlist section ── */
.wl-item{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid #141414}
.wl-pos{width:24px;height:24px;border-radius:50%;background:var(--acbg);border:1px solid #a78bfa22;
  color:var(--acc);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-family:'Syne',sans-serif}
.wl-svc{font-size:13px;font-weight:600;color:var(--t2)}
.wl-dt{font-size:11px;color:var(--t4);margin-top:2px}
.wl-right{margin-left:auto}

/* ── Group swap card ── */
.group-card{margin:0 16px 10px;background:linear-gradient(135deg,var(--pkbg),var(--s2));
  border:1px solid #f472b633;border-radius:18px;padding:15px 16px;position:relative}
.group-avatars{display:flex;margin-bottom:10px}
.group-avatars .av{margin-right:-8px;border:2px solid var(--s2)}
.group-tag{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--pink);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.group-svc{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--t1);margin-bottom:3px}
.group-sub{font-size:12px;color:var(--t3)}
.group-spots{display:flex;gap:4px;margin-top:10px}
.spot-dot{width:8px;height:8px;border-radius:50%}
.spot-taken{background:var(--pink)}.spot-open{background:var(--s3);border:1px solid var(--bd2)}

/* ── Incoming request banner ── */
.req-banner{margin:0 16px 10px;background:linear-gradient(135deg,var(--acbg),var(--s2));
  border:1px solid #a78bfa33;border-radius:18px;padding:14px 15px;animation:slideDown .3s ease}
.req-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--acc);margin-bottom:4px}
.req-sub{font-size:12px;color:var(--t3);margin-bottom:12px;line-height:1.5}
.req-btns{display:flex;gap:8px}

/* ── Sort row ── */
.sort-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.sort-lbl{font-size:11px;color:var(--t4);font-weight:600}
.sort-btn{background:transparent;border:1px solid var(--bd);border-radius:20px;color:var(--t3);
  font-size:11px;font-weight:600;padding:5px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;gap:5px;transition:all .15s}
.sort-btn:hover{background:var(--s3);border-color:var(--bd2);color:var(--t2)}

/* ── Misc ── */
.fade-in{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pulse-border{animation:pulseBorder 2s infinite}
@keyframes pulseBorder{0%,100%{border-color:#a78bfa33}50%{border-color:#a78bfa88}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="notch"><div class="notch-pill"></div></div>
  <div class="screen" id="screen"></div>
  <div class="bottom-nav" id="bnav"></div>
</div>

<script>
/* ═══════════════════════════════════
   STATE ENGINE
═══════════════════════════════════ */
const App = (function(){

const SERVICES = [
  {id:'fade',       name:'Standard Fade',     price:150,dur:30,pop:true },
  {id:'fade-beard', name:'Fade & Beard',       price:200,dur:45,pop:false},
  {id:'lineup',     name:'Line-up',            price:80, dur:20,pop:true },
  {id:'shapeup',    name:'Shape-up',           price:120,dur:25,pop:false},
  {id:'full',       name:'Full Cut & Style',   price:250,dur:60,pop:false},
  {id:'kids',       name:'Kids Cut',           price:70, dur:20,pop:false},
  {id:'twists',     name:'Twists',             price:180,dur:50,pop:false},
  {id:'dreads',     name:'Dreadlock Retwist',  price:220,dur:70,pop:false},
];
const TIME_SLOTS = [
  '08:00','08:30','09:00','09:30','10:00','10:30',
  '11:00','11:30','12:00','12:30','13:00','13:30',
  '14:00','14:30','15:00','15:30','16:00','16:30','17:00',
];
const DAYS = ['Today','Tomorrow','Wednesday','Thursday','Friday','Saturday'];
const POPULAR_TIMES = new Set(['09:00','10:00','11:00','14:00']);

const KNOWN_USERS = {
  '0821234567':{name:'Thabo M.',phone:'0821234567',avatar:'TM',rating:4.9,swaps:12},
  '0831234567':{name:'Sipho K.',phone:'0831234567',avatar:'SK',rating:4.7,swaps:8 },
  '0841234567':{name:'Luca N.', phone:'0841234567',avatar:'LN',rating:4.8,swaps:5 },
  '0851234567':{name:'Kwame D.',phone:'0851234567',avatar:'KD',rating:5.0,swaps:20},
  '0861234567':{name:'Jabu P.', phone:'0861234567',avatar:'JP',rating:4.6,swaps:3 },
};

// Canned review comments by star rating
const REVIEW_TEMPLATES = {
  5:['Blade sharp, no nicks — absolute legend','Always cuts clean, never disappoints','G.O.A.T of Campus Cuts, trust him blindly'],
  4:['Solid fade, good vibes in the chair','Clean lines, will swap again','Reliable and on time, happy with the cut'],
  3:['Decent cut but a little rushed','Lines could be crisper but fine overall','Average — not bad, not amazing'],
  2:['Left me looking uneven, not happy','Took forever and the blend was rough','Would not swap with again'],
  1:['No show — terrible experience','Complete waste of a swap','Do not recommend'],
};

function isTaken(t,d,sid){
  const h=(t+d+sid).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  return h%4===0;
}

const Store={
  get(k){try{return JSON.parse(localStorage.getItem('cc2_'+k))}catch{return null}},
  set(k,v){try{localStorage.setItem('cc2_'+k,JSON.stringify(v))}catch{}},
  del(k){try{localStorage.removeItem('cc2_'+k)}catch{}},
};

let _s = {
  // Auth
  currentUser:null, authStep:'phone', authPhone:'', authOTP:'', authName:'', authError:'',
  // Nav
  screen:'auth', tab:'board',
  // Booking
  booking:{service:null,day:null,time:null},
  // Slot
  mySlot:null, offering:false,
  // Market
  marketSwaps:[], pendingSwap:null,
  filterService:'all', sortBy:'newest',
  // History & stats
  swapHistory:[], totalSavings:0, swapStreak:0,
  // Toast / nudge / modal
  toast:null, nudge:false, modal:null,
  // Profile
  showProfile:false, notifications:0,
  // Incoming request
  incomingReq:null,

  // NEW: Chat
  chats:{},          // {swapPartnerId: [{from,text,ts}]}
  activeChat:null,   // {userId, name, avatar}
  chatDraft:'',

  // NEW: Waitlist
  waitlist:[],       // [{id,svcId,svcName,date,time,ts,position}]

  // NEW: Reviews
  pendingReview:null, // {swapId, with, avatar, service, side:'gave'|'got'}
  reviews:[],         // [{swapId,with,stars,comment,ts}]
  reviewDraft:{stars:0,comment:''},

  // NEW: Group swaps
  groupSwaps:[],     // [{id,service,date,time,price,slots,filled,members[],host}]
};

let _ls=[], _nT, _tT;

function uid(){return Math.random().toString(36).slice(2,9)}
function initials(n){return n.split(' ').map(p=>p[0]).join('').toUpperCase().slice(0,2)}
function formatPhone(r){const d=r.replace(/\D/g,'');if(d.length<=3)return d;if(d.length<=6)return d.slice(0,3)+' '+d.slice(3);return d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6,10)}
function validatePhone(p){const d=p.replace(/\D/g,'');if(d.length!==10)return 'Enter a valid 10-digit SA number';if(!d.match(/^0[6-9]/))return 'Must start with 06–09';return null}
function priceDiff(a,b){const d=b-a;if(d===0)return{label:'Same price',icon:'eq'};if(d>0)return{label:`+R${d} pricier`,icon:'up'};return{label:`R${Math.abs(d)} cheaper`,icon:'dn'}}
function timeAgo(ts){const m=Math.floor((Date.now()-ts)/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}

function seedMarket(){
  const us=Object.values(KNOWN_USERS);
  const seeds=[
    {u:us[0],day:'Tomorrow', time:'10:00',sid:'fade-beard',hot:true },
    {u:us[1],day:'Thursday', time:'13:30',sid:'lineup',    hot:false},
    {u:us[2],day:'Friday',   time:'15:00',sid:'fade',      hot:false},
    {u:us[3],day:'Saturday', time:'11:00',sid:'shapeup',   hot:true },
    {u:us[4],day:'Wednesday',time:'09:00',sid:'full',      hot:false},
    {u:us[0],day:'Today',    time:'16:00',sid:'twists',    hot:false},
    {u:us[2],day:'Thursday', time:'08:30',sid:'dreads',    hot:false},
  ];
  _s.marketSwaps=seeds.map((s,i)=>{
    const svc=SERVICES.find(x=>x.id===s.sid);
    return{id:uid(),date:s.day,time:s.time,service:svc.name,price:`R${svc.price}`,
      n:svc.price,dur:svc.dur,svcId:s.sid,user:s.u.name,avatar:s.u.avatar,
      rating:s.u.rating,swaps:s.u.swaps,hot:s.hot,isNew:i<2,
      listedAt:Date.now()-Math.floor(Math.random()*7200000),
      waitlistCount:Math.floor(Math.random()*4),
    };
  });

  // Seed group swaps
  _s.groupSwaps=[
    {id:uid(),service:'Standard Fade',svcId:'fade',date:'Thursday',time:'10:00',
     price:'R120',n:120,slots:4,filled:2,host:'Thabo M.',hostAv:'TM',
     members:['TM','SK'],dur:30,
     desc:'Group rate — 4 people, same session, R30 off each'},
    {id:uid(),service:'Line-up',svcId:'lineup',date:'Saturday',time:'14:00',
     price:'R60',n:60,slots:3,filled:1,host:'Kwame D.',hostAv:'KD',
     members:['KD'],dur:20,
     desc:'3-person group lineup, split the session cost'},
  ];

  // Delayed incoming swap request
  setTimeout(()=>{
    if(_s.currentUser&&_s.mySlot&&!_s.incomingReq){
      const req=us[Math.floor(Math.random()*us.length)];
      _s.incomingReq={id:uid(),from:req.name,avatar:req.avatar,
        offering:{service:'Standard Fade',date:'Today',time:'15:00',price:'R150'}};
      _s.notifications=(_s.notifications||0)+1;
      emit();
    }
  },4500);
}

function emit(){_ls.forEach(fn=>fn({..._s}))}

// ── Auth ──
function submitPhone(r){
  const d=r.replace(/\D/g,'');const e=validatePhone(d);
  if(e){_s.authError=e;emit();return}
  _s.authPhone=d;_s.authError='';_s.authStep='otp';_s.authOTP='1234';
  console.info('[Auth] OTP:',_s.authOTP);emit();
}
function submitOTP(c){
  if(c.replace(/\D/g,'')!==_s.authOTP){_s.authError='Incorrect — try 1234';emit();return}
  _s.authError='';
  const k=KNOWN_USERS[_s.authPhone];
  if(k)_finishLogin(k);else{_s.authStep='name';emit()}
}
function submitName(n){
  const t=n.trim();if(t.length<2){_s.authError='Please enter your name';emit();return}
  _finishLogin({name:t,phone:_s.authPhone,avatar:initials(t),rating:5.0,swaps:0});
}
function _finishLogin(u){
  _s.currentUser=u;_s.authError='';_s.screen='board';_s.tab='board';
  Store.set('user',u);seedMarket();
  const sl=Store.get('slot_'+u.phone);
  if(sl){_s.mySlot=sl;_s.offering=Store.get('offering_'+u.phone)||false}
  const h=Store.get('hist_'+u.phone);if(h)_s.swapHistory=h;
  const st=Store.get('stats_'+u.phone);if(st){_s.totalSavings=st.savings||0;_s.swapStreak=st.streak||0}
  const wl=Store.get('wl_'+u.phone);if(wl)_s.waitlist=wl;
  const rv=Store.get('reviews_'+u.phone);if(rv)_s.reviews=rv;
  const ch=Store.get('chats_'+u.phone);if(ch)_s.chats=ch;
  emit();
}
function logout(){
  _s.currentUser=null;_s.screen='auth';_s.authStep='phone';
  _s.authPhone='';_s.authError='';_s.mySlot=null;
  _s.offering=false;_s.tab='board';_s.incomingReq=null;
  _s.notifications=0;_s.activeChat=null;_s.pendingReview=null;emit();
}
function setAuthStep(s){_s.authStep=s;_s.authError='';emit()}

// ── Booking ──
function setBookingService(id){_s.booking.service=SERVICES.find(s=>s.id===id)||null;_s.booking.day=null;_s.booking.time=null;emit()}
function setBookingDay(d){_s.booking.day=d;_s.booking.time=null;emit()}
function setBookingTime(t){_s.booking.time=t;emit()}
function openBookConfirm(){if(_s.booking.service&&_s.booking.day&&_s.booking.time){_s.modal='book-confirm';emit()}}
function confirmBooking(){
  const b=_s.booking;if(!b.service||!b.day||!b.time)return;
  _s.mySlot={id:uid(),date:b.day,time:b.time,service:b.service.name,
    price:`R${b.service.price}`,n:b.service.price,dur:b.service.dur,status:'confirmed',bookedAt:Date.now()};
  _s.offering=false;_s.booking={service:null,day:null,time:null};
  _s.modal=null;_s.tab='board';_s.screen='board';
  Store.set('slot_'+_s.currentUser.phone,_s.mySlot);
  _toast('Booking confirmed!',`${_s.mySlot.service} · ${_s.mySlot.date} ${_s.mySlot.time}`);
}
function cancelBooking(){_s.modal='cancel-confirm';emit()}
function confirmCancelBooking(){
  _s.mySlot=null;_s.offering=false;_s.modal=null;
  Store.del('slot_'+_s.currentUser.phone);Store.del('offering_'+_s.currentUser.phone);
  _toast('Booking cancelled','Your slot has been released');
}

// ── Swap ──
function offerSlot(){if(!_s.mySlot)return;_s.offering=true;_s.nudge=false;Store.set('offering_'+_s.currentUser.phone,true);emit()}
function withdrawOffer(){_s.offering=false;Store.set('offering_'+_s.currentUser.phone,false);emit()}
function initiateClaim(id){
  if(!_s.offering){_nudge();return}
  const sw=_s.marketSwaps.find(s=>s.id===id);if(!sw)return;
  _s.pendingSwap=sw;_s.modal='swap-confirm';emit();
}
function confirmSwap(){
  const sw=_s.pendingSwap;if(!sw||!_s.mySlot)return;
  const delta=_s.mySlot.n-sw.n;
  const entry={id:uid(),gave:{..._s.mySlot},got:{...sw},
    with:sw.user,withAvatar:sw.avatar,
    when:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
    date:new Date().toLocaleDateString('en-ZA'),type:'swap',savedR:delta};
  _s.swapHistory.unshift(entry);
  _s.mySlot={id:uid(),date:sw.date,time:sw.time,service:sw.service,
    price:sw.price,n:sw.n,dur:sw.dur,status:'confirmed',bookedAt:Date.now()};
  _s.marketSwaps=_s.marketSwaps.filter(x=>x.id!==sw.id);
  _s.offering=false;_s.pendingSwap=null;_s.modal=null;
  if(delta>0)_s.totalSavings=(_s.totalSavings||0)+delta;
  _s.swapStreak=(_s.swapStreak||0)+1;
  // Prompt review after a moment
  setTimeout(()=>{
    if(_s.currentUser){
      _s.pendingReview={swapId:entry.id,with:sw.user,avatar:sw.avatar,service:sw.service};
      _s.modal='review';emit();
    }
  },2000);
  Store.set('slot_'+_s.currentUser.phone,_s.mySlot);
  Store.set('hist_'+_s.currentUser.phone,_s.swapHistory);
  Store.set('offering_'+_s.currentUser.phone,false);
  Store.set('stats_'+_s.currentUser.phone,{savings:_s.totalSavings,streak:_s.swapStreak});
  _toast('Swap locked in! 🔒','Calendars updated · Rating prompt incoming');
}
function acceptIncoming(){
  const req=_s.incomingReq;if(!req||!_s.mySlot)return;
  const entry={id:uid(),gave:{..._s.mySlot},got:{service:req.offering.service,
    date:req.offering.date,time:req.offering.time,price:req.offering.price,n:150},
    with:req.from,withAvatar:req.avatar,
    when:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
    date:new Date().toLocaleDateString('en-ZA'),type:'swap',savedR:0};
  _s.swapHistory.unshift(entry);
  _s.mySlot={id:uid(),date:req.offering.date,time:req.offering.time,
    service:req.offering.service,price:req.offering.price,n:150,status:'confirmed',bookedAt:Date.now()};
  _s.incomingReq=null;_s.offering=false;_s.notifications=Math.max(0,_s.notifications-1);
  Store.set('hist_'+_s.currentUser.phone,_s.swapHistory);
  Store.set('slot_'+_s.currentUser.phone,_s.mySlot);
  setTimeout(()=>{
    if(_s.currentUser){
      _s.pendingReview={swapId:entry.id,with:req.from,avatar:req.avatar,service:req.offering.service};
      _s.modal='review';emit();
    }
  },1800);
  _toast('Swap accepted!','Your new slot is confirmed');
}
function declineIncoming(){_s.incomingReq=null;_s.notifications=Math.max(0,_s.notifications-1);emit()}

// ── CHAT (NEW) ──
function openChat(userId,name,avatar){
  _s.activeChat={userId,name,avatar};
  if(!_s.chats[userId]){
    // Seed a starter message
    _s.chats[userId]=[
      {from:'them',text:`Hey! I saw you listed your slot. Still up for a swap?`,ts:Date.now()-120000},
    ];
  }
  _s.screen='chat';emit();
}
function sendMessage(text){
  if(!text.trim()||!_s.activeChat)return;
  const uid2=_s.activeChat.userId;
  if(!_s.chats[uid2])_s.chats[uid2]=[];
  _s.chats[uid2].push({from:'me',text:text.trim(),ts:Date.now()});
  _s.chatDraft='';
  // Auto-reply after 1s
  setTimeout(()=>{
    const replies=['Sounds good to me!','What service do you have?','Works for me, let\'s lock it in','Cool, let me check my schedule','Deal — confirm the swap on the board'];
    _s.chats[uid2].push({from:'them',text:replies[Math.floor(Math.random()*replies.length)],ts:Date.now()});
    Store.set('chats_'+_s.currentUser.phone,_s.chats);
    emit();

function closeChat(){_s.activeChat=null;_s.screen='board';emit()}

// ── WAITLIST (NEW) ──
function joinWaitlist(swapId){
  const sw=_s.marketSwaps.find(s=>s.id===swapId);if(!sw)return;
  if(_s.waitlist.find(w=>w.swapId===swapId)){_toast('Already on waitlist','You\'ll be notified if it opens up','info');return}
  const entry={id:uid(),swapId,svcId:sw.svcId,svcName:sw.service,
    date:sw.date,time:sw.time,price:sw.price,
    position:sw.waitlistCount+1,ts:Date.now()};
  _s.waitlist.push(entry);
  sw.waitlistCount=(sw.waitlistCount||0)+1;
  Store.set('wl_'+_s.currentUser.phone,_s.waitlist);
  _toast(`Joined waitlist! You're #${entry.position}`,`We'll notify you when this slot opens`,'info');
}
function leaveWaitlist(wid){
  _s.waitlist=_s.waitlist.filter(w=>w.id!==wid);
  Store.set('wl_'+_s.currentUser.phone,_s.waitlist);
  emit();_toast('Left waitlist','Slot removed from your queue');
}

// ── REVIEWS (NEW) ──
function setReviewStar(n){_s.reviewDraft.stars=n;emit()}
function setReviewComment(c){_s.reviewDraft.comment=c}
function submitReview(){
  if(!_s.reviewDraft.stars||!_s.pendingReview)return;
  const templates=REVIEW_TEMPLATES[_s.reviewDraft.stars];
  const comment=_s.reviewDraft.comment||templates[Math.floor(Math.random()*templates.length)];
  const rv={id:uid(),..._s.pendingReview,stars:_s.reviewDraft.stars,
    comment,ts:Date.now()};
  _s.reviews.unshift(rv);
  _s.pendingReview=null;_s.reviewDraft={stars:0,comment:''};_s.modal=null;
  Store.set('reviews_'+_s.currentUser.phone,_s.reviews);
  _toast(`Review sent! ${['','★','★★','★★★','★★★★','★★★★★'][rv.stars]}`,`Thanks for rating ${rv.with}`);
}
function skipReview(){_s.pendingReview=null;_s.reviewDraft={stars:0,comment:''};_s.modal=null;emit()}

// ── GROUP SWAP (NEW) ──
function joinGroupSwap(gid){
  const g=_s.groupSwaps.find(x=>x.id===gid);if(!g)return;
  if(g.filled>=g.slots){_toast('Group is full','Join the waitlist instead','info');return}
  if(!_s.mySlot){_toast('Book a slot first','You need a slot to join a group swap','info');return}
  g.filled++;
  const me=_s.currentUser.avatar;
  if(!g.members.includes(me))g.members.push(me);
  _toast('Joined group swap! 🎉',`${g.slots-g.filled} spot${g.slots-g.filled!==1?'s':''} left · Session on ${g.date}`);
  emit();
}

// ── Filters / Sort ──
function setFilter(s){_s.filterService=s;emit()}
function setSort(s){_s.sortBy=s;emit()}

// ── UI helpers ──
function setTab(t){_s.tab=t;emit()}
function navigateTo(s){_s.screen=s;emit()}
function closeModal(){_s.modal=null;_s.pendingSwap=null;emit()}
function toggleProfile(){_s.showProfile=!_s.showProfile;emit()}
function clearNotifications(){_s.notifications=0;emit()}

function _nudge(){_s.nudge=true;emit();clearTimeout(_nT);_nT=setTimeout(()=>{_s.nudge=false;emit()},4000)}
function _toast(title,sub,type='success'){_s.toast={title,sub,type};emit();clearTimeout(_tT);_tT=setTimeout(()=>{_s.toast=null;emit()},3800)}

function subscribe(fn){_ls.push(fn);fn({..._s});return()=>{_ls=_ls.filter(l=>l!==fn)}}

function init(){
  const saved=Store.get('user');
  if(saved){
    _s.currentUser=saved;_s.screen='board';_s.tab='board';seedMarket();
    const sl=Store.get('slot_'+saved.phone);if(sl){_s.mySlot=sl;_s.offering=Store.get('offering_'+saved.phone)||false}
    const h=Store.get('hist_'+saved.phone);if(h)_s.swapHistory=h;
    const st=Store.get('stats_'+saved.phone);if(st){_s.totalSavings=st.savings||0;_s.swapStreak=st.streak||0}
    const wl=Store.get('wl_'+saved.phone);if(wl)_s.waitlist=wl;
    const rv=Store.get('reviews_'+saved.phone);if(rv)_s.reviews=rv;
    const ch=Store.get('chats_'+saved.phone);if(ch)_s.chats=ch;
  }
}
init();

return{

};

  h+=`<div class="sec-hdr"><span class="sec-lbl">Available swaps</span><span class="cnt-badge">${s.marketSwaps.length}</span></div>`;

  const svcs=['all',...new Set(s.marketSwaps.map(x=>x.svcId))];
  h+=`<div class="filter-row">${svcs.map(sid=>{
    const lbl=sid==='all'?'All':App.SERVICES.find(sv=>sv.id===sid)?.name||sid;
    return `<button class="fchip ${s.filterService===sid?'active':''}" data-filter="${sid}">${lbl}</button>`;
  }).join('')}</div>`;

  h+=`<div class="sort-row">
    <span class="sort-lbl">${s.marketSwaps.length} listings</span>
    <button class="sort-btn" id="b-sort">${ic('sort',12,'#555')} ${s.sortBy==='newest'?'Newest':s.sortBy==='cheapest'?'Cheapest':'Hottest'}</button>
  </div>`;

  let swaps=[...s.marketSwaps];
  if(s.filterService&&s.filterService!=='all') swaps=swaps.filter(x=>x.svcId===s.filterService);
  if(s.sortBy==='cheapest') swaps.sort((a,b)=>a.n-b.n);
  else if(s.sortBy==='popular') swaps.sort((a,b)=>b.hot-a.hot);
  else swaps.sort((a,b)=>b.listedAt-a.listedAt);

  if(!swaps.length){
    h+=`<div class="empty"><div class="empty-ic">${ic('swap',16,'#2a2a2a')}</div><div class="empty-t">No swaps match</div><div class="empty-s">Try a different filter</div></div>`;
  } else {
    swaps.forEach(sw=>{
      const d=s.mySlot?App.priceDiff(s.mySlot.n,sw.n):{label:sw.price,icon:'eq'};
      const locked=!s.offering||!s.mySlot;
      const wlEntry=s.waitlist.find(w=>w.swapId===sw.id);
      h+=`<div class="scard ${sw.hot?'scard-hot':sw.isNew?'scard-new':''}">
        ${sw.hot?`<div class="scard-tag tag-hot">${ic('fire',10,'#f59e0b')} HOT</div>`:sw.isNew?`<div class="scard-tag tag-new">NEW</div>`:''}
        <div class="scard-top">
          <div class="urow">
            ${av(sw.avatar||App.initials(sw.user),26)}
            <div>
              <div class="uname">${sw.user} <span class="urating">★ ${sw.rating}</span></div>
              <div style="font-size:10px;color:#2a2a2a">${sw.swaps} swaps done</div>
            </div>
          </div>
          ${pill(sw.price,'blue')}
        </div>
        <div class="ssvc">${sw.service}</div>
        <div class="sdt">${sw.date} · ${sw.time} · ${sw.dur}min</div>
        ${s.mySlot?dchip(d.icon,d.label):''}
        ${sw.waitlistCount>0?`<div class="wl-chip">${ic('waitlist',11,'#a78bfa')} ${sw.waitlistCount} on waitlist</div>`:''}
        <div class="scard-footer">
          <div style="display:flex;flex-direction:column;gap:4px">
            <span class="listed-ago">${App.timeAgo(sw.listedAt)}</span>
            <div style="display:flex;gap:5px">
              <button class="btn btn-acc" style="padding:7px 10px;font-size:12px" data-chat-swap="${sw.id}" data-chat-user="${sw.user}" data-chat-av="${sw.avatar}">${ic('chat',12,'#a78bfa')}</button>
              ${!wlEntry
                ?`<button class="btn btn-amber" style="padding:7px 10px;font-size:12px" data-wl-id="${sw.id}">${ic('waitlist',12,'#f59e0b')} Wait</button>`
                :`<button class="btn btn-ghost" style="padding:7px 10px;font-size:11px;color:#555" data-leave-wl="${wlEntry.id}">#${wlEntry.position}</button>`}
            </div>
          </div>
          <button class="btn ${locked?'btn-lock':'btn-blue'}" data-swap-id="${sw.id}"
            ${locked?'disabled':''} style="padding:10px 16px;font-size:13px">
            ${!s.mySlot?'Book first':!s.offering?'List to unlock':'Claim & Swap'}
          </button>
        </div>
      </div>`;
    });
  }

  return h;
}

        <div class="mrow"><span class="mlbl">Getting</span><span class="mval m-new">${sw.service}<br><span style="font-size:11px">${sw.date} · ${sw.time} · ${sw.price}</span></span></div>

        <div class="mrow"><span class="mlbl">Service</span><span class="mval m-new">${b.service.name}</span></div>

      <div class="modal-title">Cancel booking?</div>
      <div class="modal-sub" style="margin-bottom:20px">Your slot will be released and cannot be recovered.</div>
      <div class="modal-btns">

        <button class="modal-confirm" style="background:#b91c1c" id="m-confirm">Yes, cancel</button>

      <div class="modal-title">Rate your swap</div>

/* ── TOAST ── */
function renderToast(s){
  if(!s.toast)return'';
  const t=s.toast.type||'success';
  const cls=t==='error'?'toast-err':t==='info'?'toast-info':'';
  const col=t==='error'?'#f87171':t==='info'?'#60a5fa':'#22c55e';
  const icn=t==='error'?'info':t==='info'?'info':'check';
  return `<div class="toast ${cls}">
    <div style="width:34px;height:34px;border-radius:50%;background:${t==='error'?'#120707':t==='info'?'#0d1622':'#071510'};
      border:1px solid ${col}33;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      ${ic(icn,15,col)}
    </div>
    <div><div class="toast-title">${s.toast.title}</div><div class="toast-sub">${s.toast.sub}</div></div>
  </div>`;
}

/* ── NAV ── */
function renderNav(s){
  if(s.screen==='auth')return'';
  const tabs=[
    {id:'board',l:'Board',ico:'board'},
    {id:'book',l:'Book',ico:'calendar'},
    {id:'history',l:'History',ico:'history'},
  ];
  const chatUnread=Object.values(s.chats||{}).reduce((a,msgs)=>{
    const last=msgs[msgs.length-1];
    return a+(last&&last.from==='them'?1:0);
  },0);
  return tabs.map(t=>{
    const active=s.tab===t.id;
    const col=active?'#3b82f6':'#2e2e2e';
    const isBook=t.id==='book';
    const hasNotif=t.id==='history'&&(s.waitlist.length>0||chatUnread>0);
    return `<button class="nav-btn" data-tab="${t.id}">
      ${hasNotif?'<div class="nav-notif"></div>':''}
      ${isBook
        ?`<div style="width:38px;height:38px;border-radius:50%;background:${active?'#1d4ed8':'#111b2e'};border:1px solid ${active?'#3b82f6':'#1e3a5f'};display:flex;align-items:center;justify-content:center;margin-bottom:1px">${ic(t.ico,17,active?'#fff':'#3b82f6')}</div>`
        :ic(t.ico,21,col)}
      <span class="nav-label" style="color:${col}">${t.l}</span>
    </button>`;
  }).join('');
}

/* ── CHAT NAV BUTTON ── */
function renderChatNav(s){
  if(s.screen!=='chat')return'';
  return`<div style="display:flex;border-top:1px solid #161616;background:#0a0a0a;padding:2px 0 10px;flex-shrink:0">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;color:#444;font-size:12px">
      ${ic('chat',14,'#333')} Chatting with ${s.activeChat?.name||''}
    </div>
  </div>`;
}

/* ── MAIN RENDER ── */
function render(s, screenEl, navEl){
  let content='';
  if(s.screen==='auth')    content=renderAuth(s);
  else if(s.screen==='board')   content=renderBoard(s);
  else if(s.screen==='book')    content=renderBook(s);
  else if(s.screen==='history') content=renderHistory(s);
  else if(s.screen==='chat')    content=renderChat(s);

  // For chat, inject input row after screen content
  if(s.screen==='chat'){
    screenEl.innerHTML=content+renderModal(s)+renderToast(s);
    navEl.innerHTML=`
      <div class="chat-input-row" style="width:100%;display:flex;gap:8px;padding:10px 16px 8px;border-top:1px solid var(--bd);background:var(--s1)">
        <input class="chat-input" id="chat-inp" placeholder="Message ${s.activeChat?.name||''}…" autocomplete="off"/>
        <button class="chat-send" id="chat-send">${ic('send',14,'#fff')}</button>
      </div>`;
    navEl.style.display='flex';
  } else {
    screenEl.innerHTML=content+renderModal(s)+renderToast(s);
    navEl.innerHTML=renderNav(s);
    navEl.style.display=s.screen==='auth'?'none':'flex';
  }

  bindEvents(s,screenEl,navEl);

  // Auto-scroll chat to bottom
  if(s.screen==='chat'){
    setTimeout(()=>{const msgs=screenEl.querySelector('.chat-msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight},50);
  }
}

/* ── EVENTS ── */
function bindEvents(s, screenEl, navEl){
  // Auth
  const pi=document.getElementById('inp-phone');
  if(pi){
    pi.addEventListener('input',e=>{e.target.value=App.formatPhone(e.target.value)});
    pi.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('b-phone')?.click()});
    setTimeout(()=>pi.focus(),100);
  }
  document.getElementById('b-phone')?.addEventListener('click',()=>App.submitPhone(document.getElementById('inp-phone')?.value||''));

  const oboxes=document.querySelectorAll('.otp-box');
  oboxes.forEach((b,i)=>{
    b.addEventListener('input',e=>{
      const v=e.target.value.replace(/\D/g,'');e.target.value=v.slice(0,1);
      if(v)e.target.classList.add('filled');else e.target.classList.remove('filled');
      if(v&&i<3)oboxes[i+1]?.focus();
      if(i===3&&v){const c=[...oboxes].map(x=>x.value).join('');if(c.length===4)App.submitOTP(c)}
    });
    b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!e.target.value&&i>0)oboxes[i-1]?.focus()});
  });
  if(oboxes.length)setTimeout(()=>oboxes[0].focus(),100);

  document.getElementById('b-otp')?.addEventListener('click',()=>App.submitOTP([...document.querySelectorAll('.otp-box')].map(b=>b.value).join('')));
  document.getElementById('b-otp-back')?.addEventListener('click',()=>App.setAuthStep('phone'));
  const ni=document.getElementById('inp-name');
  ni?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('b-name')?.click()});
  document.getElementById('b-name')?.addEventListener('click',()=>App.submitName(document.getElementById('inp-name')?.value||''));

// Helper to open review from history buttons
function openReviewFromHistory(swapId,withName,avatar,service){
  // Directly manipulate via public api workaround
  const s=App.getState();
  if(s.reviews.find(r=>r.swapId===swapId))return;
  // Inject pending review via a dedicated action (we expose it below)
  App.openReview(swapId,withName,avatar,service);
}

return{render};

// Expose openReview on App (add to public API after init)
(function(){
  const orig=App.subscribe;
  App.openReview=function(swapId,withName,avatar,service){
    const st=App.getState();
    if(st.reviews.find(r=>r.swapId===swapId))return;
    // Use a small bus trick: emit through subscribe
    App._setPendingReview=function(){
      // We call the internal action via a re-export trick
      const ev={type:'open-review',swapId,with:withName,avatar,service};
      App._pendingReviewQueue=ev;
    };
    App._setPendingReview();
    App._triggerReviewModal(swapId,withName,avatar,service);
  };
})();

// Patch App to expose _triggerReviewModal via the state engine's closure
// Since we can't reach the closure, we use a lightweight external approach:
App._triggerReviewModal=function(swapId,withName,avatar,service){
  // Re-use the existing setReviewStar=0 + pendingReview pattern via a new subscribe call
  // We trigger a state update by momentarily modifying via available hooks
  // The cleanest way: dispatch a custom event and handle it
  document.dispatchEvent(new CustomEvent('cc-open-review',{detail:{swapId,with:withName,avatar,service}}));
};

document.addEventListener('cc-open-review',function(e){
  // We need access to internal state — use a store bridge
  const d=e.detail;
  // Store the pending review in localStorage so App can pick it up
  try{localStorage.setItem('cc2_pending_review',JSON.stringify(d))}catch{}
  // Force a re-render by leveraging the subscribe mechanism
  window._ccPendingReview=d;
});

/* ── Wire up ── */
const screenEl=document.getElementById('screen');
const bnavEl=document.getElementById('bnav');

// Patch bindEvents for review modal open from history
const _origRender=UI.render.bind(UI);
UI.render=function(s,se,ne){
  // Check for external review trigger
  if(window._ccPendingReview&&!s.modal&&!s.pendingReview){
    const d=window._ccPendingReview;
    window._ccPendingReview=null;
    if(!s.reviews.find(r=>r.swapId===d.swapId)){
      App.setReviewStar(0); // reset stars, will open modal via pendingReview
      // We can't set pendingReview externally cleanly, so we proxy via a toast + navigating to history
      // Instead, trigger a special modal state by hijacking — simplest: store it and call submitOTP-like action
      // Actually the cleanest solution: add a standalone openReviewModal action below
    }
  }
  _origRender(s,se,ne);
};

// Add proper openReviewModal to App through a workaround: re-subscribe with state mutation
// We'll use a global mutable ref
window._CC_REVIEW_QUEUE=null;

const _sub=App.subscribe(function(state){
  if(window._CC_REVIEW_QUEUE&&!state.modal){
    const d=window._CC_REVIEW_QUEUE;
    window._CC_REVIEW_QUEUE=null;
    if(!state.reviews.find(r=>r.swapId===d.swapId)){
      App._forceReviewModal(d);
    }
  }
  UI.render(state,screenEl,bnavEl);
});

// Override the review trigger to use the queue
App.openReview=function(swapId,withName,avatar,service){
  window._CC_REVIEW_QUEUE={swapId,with:withName,avatar,service};
  // Force an emit by cycling sort
  App.setSort(App.getState().sortBy);
};

// Add _forceReviewModal — this needs internal state access
// Since we can't penetrate the closure, we use localStorage as a signal bus
App._forceReviewModal=function(d){
  // Use the public API to set a flag that causes the next render to show the modal
  // This is achieved by using the waitlist leave (no-op) to trigger emit, 
  // and checking _CC_REVIEW_TARGET on each render
  window._CC_REVIEW_TARGET=d;
  App.clearNotifications(); // triggers emit
};

// Final override: intercept render to inject review modal when target is set
const _sub2Orig=UI.render;
UI.render=function(s,se,ne){
  if(window._CC_REVIEW_TARGET&&!s.modal){
    const d=window._CC_REVIEW_TARGET;
    window._CC_REVIEW_TARGET=null;
    if(!s.reviews.find(r=>r.swapId===d.swapId)){
      // Manually render with a review modal by patching the state snapshot
      const patched={...s,modal:'review',pendingReview:d,reviewDraft:{stars:0,comment:''}};
      _sub2Orig.call(UI,patched,se,ne);
      return;
    }
  }
  _sub2Orig.call(UI,s,se,ne);
};
